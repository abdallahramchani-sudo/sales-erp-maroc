name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'HTTPS URL of the deployed Sales ERP web app'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Android project
        run: npx cap add android
        env:
          APP_URL: ${{ inputs.app_url }}

      - name: Configure remote web app
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'capacitor.config.ts';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes("process.env.APP_URL")) throw new Error('APP_URL configuration missing');
          NODE
        env:
          APP_URL: ${{ inputs.app_url }}

      - name: Copy web assets
        run: npx cap copy android
        env:
          APP_URL: ${{ inputs.app_url }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sales-erp-maroc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
